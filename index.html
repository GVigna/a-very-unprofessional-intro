<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>A Very Unprofessional Intro</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- analytics (Foliaire: privacy-first, no cookies) -->
  <script>window.FOLIAIRE_SITE_ID = '501012e66216908772bb49a9';</script>
  <script async src="https://foliairestudio.com/analytics/foliaire.js"></script>
  <!-- retro postcard fonts (city names) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bungee+Inline&family=Pinyon+Script&family=Shrikhand&family=Righteous&family=Fraunces:opsz,wght,SOFT@9..144,900,100&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1795347894">
</head>
<body>
  <!-- The canvas: every tap on empty space here reveals the next beat -->
  <main id="stage" tabindex="0" aria-label="Story canvas. Click, tap, or press Enter to reveal the next part.">
  </main>

  <!-- Fixed controls (never trigger reveals) -->
  <div class="ui-band ui-band-top" id="band-top" aria-hidden="true"></div>
  <div class="ui-band ui-band-bottom" id="band-bottom" aria-hidden="true"></div>
  <div class="ui ui-progress" id="progress" aria-live="polite"></div>
  <nav class="ui ui-contact" aria-label="Contact">
    <a class="ui-link ui-portfolio" id="link-portfolio" target="_blank" rel="noopener" hidden>ACTUAL PORTFOLIO</a>
    <a class="ui-link ui-email" id="link-email" hidden>EMAIL ME</a>
    <a class="ui-link ui-cv" id="link-cv" target="_blank" rel="noopener" hidden>CV</a>
  </nav>
  <button class="ui ui-restart" id="restart" type="button">RESTART</button>
  <button class="ui ui-back" id="back" type="button" aria-label="Back one step" hidden><svg viewBox="0 0 40 24" aria-hidden="true"><path d="M38 12H3M13 2 3 12l10 10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <button class="ui ui-next" id="next" type="button" aria-label="Next step"><svg viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12h35M27 2l10 10-10 10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <!-- "click anywhere" starburst, shown until the first tap -->
  <div class="hint-burst" id="hint" aria-hidden="true"><svg viewBox="0 0 200 140"><polygon id="hint-shape"/></svg><span>CLICK<br>ANYWHERE</span></div>

  <!-- iPhone-style alert, halfway through -->
  <div class="ios-alert-wrap" id="midalert" hidden>
    <div class="ios-alert" role="alertdialog" aria-modal="true" aria-labelledby="midalert-t" aria-describedby="midalert-m">
      <p class="ios-t" id="midalert-t">You made it this far!</p>
      <p class="ios-m" id="midalert-m">Wanna shoot an email and have a chat?</p>
      <div class="ios-btns"><button type="button" id="midalert-no">No, continue</button><a id="midalert-yes" href="#">Send email</a></div>
    </div>
  </div>

  <!-- CV / portfolio viewer, with a way back to the site -->
  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Viewer">
    <div class="viewer-bar"><button type="button" id="viewer-back">← BACK TO THE SITE</button><a id="viewer-open" target="_blank" rel="noopener"><span class="vo-long">OPEN IN A NEW TAB ↗</span><span class="vo-short">NEW TAB ↗</span></a></div>
    <div class="viewer-body" id="viewer-body"></div>
  </div>

  <script src="js/content.js?v=1795347894"></script>
  <script src="js/app.js?v=1795347894"></script>
</body>
</html>
