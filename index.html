<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>A Very Unprofessional Introduction — prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The canvas: every tap on empty space here reveals the next beat -->
  <main id="stage" tabindex="0" aria-label="Story canvas. Click, tap, or press Enter to reveal the next part.">
  </main>

  <!-- Fixed controls (never trigger reveals) -->
  <div class="ui ui-progress" id="progress" aria-live="polite">00/10</div>
  <button class="ui ui-restart" id="restart" type="button">RESTART</button>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
